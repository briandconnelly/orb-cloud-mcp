[project]
name = "orb-cloud-mcp"
version = "0.1.1"
description = "MCP server for Orb Cloud device management and data analysis"
authors = [
    { name = "Brian Connelly", email = "bdc@bconnelly.net" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cachetools>=7.0.4",
    "fastmcp>=2.0",
    "orb-cloud-client>=1.3.3",
    "pydantic>=2.0",
]

[project.scripts]
orb-cloud-mcp = "orb_cloud_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "types-cachetools>=6.2.0.20251022",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=orb_cloud_mcp --cov-report=term-missing --cov-fail-under=90"

[tool.ruff.lint]
select = ["I", "F", "UP", "RUF", "ASYNC", "B", "SIM"]

[tool.coverage.run]
branch = true
